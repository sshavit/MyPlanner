[project]
name = "mysocial"
version = "0.1.0"
default-app = "web"
jac-version = "==0.37.23"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web"

[apps.mobile]
platform = "ios"
kind = "mobile"
entry-point = "mobile"

[apps.mobile.client]
[apps.mobile.client.react_native]
release = false



[apps.desktop]
kind = "desktop"
entry-point = "desktop"

[apps.desktop.desktop]
name = "Simon's Scheduler"
identifier = "org.jaclang.tinyjacyac"
backend = "${PLANNER_URL:-http://127.0.0.1:8000}"


[apps.cli]
kind = "cli"
entry-point = "cli"

[apps.feed]
kind = "service"
entry-point = "core.feed"

[apps.scoring]
kind = "service"
entry-point = "core.scoring"


[dependencies]
[dependencies.npm]
react-native-web = "^0.21.2"


[test]
directories = ["core"]

[client]
[client.app_meta_data]
title = "Simon's Scheduler | Student Planner"
description = "Plan coursework and make progress every day with Simon's Scheduler."
icon = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Simon%27s%20Scheduler%20SS%20logo%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22ss%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23477BF5%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238A5CF6%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2217%22%20fill%3D%22url%28%23ss%29%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M27%2020C23%2017%2015%2017%2013%2022c-3%206%202%209%209%2011%208%203%209%209%204%2013-4%204-11%203-15-1M53%2020c-4-3-12-3-14%202-3%206%202%209%209%2011%208%203%209%209%204%2013-4%204-11%203-15-1%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%3C%2Fsvg%3E"

[byllm.model]
default_model = "gpt-4o-mini"

# Service authentication routes require fleet routing in Jac 0.37.23.
# This makes plain `jac run` start web + the shared planning service correctly.
[scale.gateway]
colocate = false
