[project]
name = "mysocial"
version = "0.1.0"
default-app = "web"
jac-version = "==0.37.23"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web"

[apps.mobile]
platform = "ios"
kind = "mobile"
entry-point = "mobile"

[apps.mobile.client]
[apps.mobile.client.react_native]
release = false



[apps.desktop]
kind = "desktop"
entry-point = "desktop"

[apps.desktop.desktop]
name = "Daymark"
identifier = "org.jaclang.tinyjacyac"
backend = "${PLANNER_URL:-http://127.0.0.1:8000}"


[apps.cli]
kind = "cli"
entry-point = "cli"

[apps.feed]
kind = "service"
entry-point = "core.feed"

[apps.scoring]
kind = "service"
entry-point = "core.scoring"


[dependencies]
[dependencies.npm]
react-native-web = "^0.21.2"


[test]
directories = ["core"]

[client]
[client.app_meta_data]
title = "Daymark | Student Planner"
description = "Your semester, in perspective. Coursework and study planning."
icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23355d45'/%3E%3Ctext x='11' y='29' font-family='sans-serif' font-size='30' fill='white'%3Et%3C/text%3E%3C/svg%3E"

[byllm.model]
default_model = "gpt-4o-mini"

# Service authentication routes require fleet routing in Jac 0.37.23.
# This makes plain `jac run` start web + the shared planning service correctly.
[scale.gateway]
colocate = false
