[project]
name = "mysocial"
version = "0.1.0"
default-app = "web"
jac-version = "==0.37.23"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web"

[apps.mobile]
platform = "ios"
kind = "mobile"
entry-point = "mobile"

[apps.mobile.client]
[apps.mobile.client.react_native]
release = false



[apps.desktop]
kind = "desktop"
entry-point = "desktop"

[apps.desktop.desktop]
name = "SiMinute"
identifier = "org.jaclang.tinyjacyac"
backend = "${PLANNER_URL:-http://127.0.0.1:8000}"


[apps.cli]
kind = "cli"
entry-point = "cli"

[apps.feed]
kind = "service"
entry-point = "core.feed"

[apps.scoring]
kind = "service"
entry-point = "core.scoring"


[dependencies]
[dependencies.npm]
react-native-web = "^0.21.2"


[test]
directories = ["core"]

[client]
[client.app_meta_data]
title = "SiMinute | Student Planner"
description = "Calendar for coursework, assignments, and events."
icon = "/static/assets/timon-logo.png"

[byllm.model]
default_model = "gpt-4o-mini"

# Service authentication routes require fleet routing in Jac 0.37.23.
# This makes plain `jac run` start web + the shared planning service correctly.
[scale.gateway]
colocate = false
